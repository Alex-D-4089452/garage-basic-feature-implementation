name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Frontend deploys are handled by Vercel's own GitHub integration — connect
  # the repo in the Vercel dashboard and it deploys automatically on push.
  # This job only handles what Firebase itself owns: Firestore security rules.
  deploy-firestore-rules:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 --decode > /tmp/gcp-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV

      - name: Deploy Firestore rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export ACCESS_TOKEN

          python <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib import error, request

          project_id = os.environ["FIREBASE_PROJECT_ID"]
          access_token = os.environ["ACCESS_TOKEN"]
          rules_source = Path("firebase/firestore.rules").read_text(encoding="utf-8")

          headers = {
              "Authorization": "Bearer " + access_token,
              "Content-Type": "application/json; charset=utf-8",
          }

          def call(method: str, url: str, payload: dict) -> dict:
              req = request.Request(
                  url=url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method=method,
              )
              try:
                  with request.urlopen(req) as response:
                      return json.loads(response.read().decode("utf-8"))
              except error.HTTPError as http_error:
                  print(f"{method} {url} failed with HTTP {http_error.code}", file=sys.stderr)
                  print(http_error.read().decode("utf-8"), file=sys.stderr)
                  raise

          ruleset = call(
              method="POST",
              url=f"https://firebaserules.googleapis.com/v1/projects/{project_id}/rulesets",
              payload={
                  "source": {
                      "files": [
                          {
                              "name": "firestore.rules",
                              "content": rules_source,
                          }
                      ]
                  }
              },
          )

          ruleset_name = ruleset["name"]
          # The PATCH body is an UpdateReleaseRequest, so the release fields
          # must be nested under "release" rather than sent as a bare Release.
          release = call(
              method="PATCH",
              url=(
                  "https://firebaserules.googleapis.com/v1/"
                  f"projects/{project_id}/releases/cloud.firestore?updateMask=rulesetName"
              ),
              payload={
                  "release": {
                      "name": f"projects/{project_id}/releases/cloud.firestore",
                      "rulesetName": ruleset_name,
                  }
              },
          )

          print(f"Released {ruleset_name} to {release['name']}")
          PY

  # Optional — only needed if this project actually uses backend/ (the Express
  # API). Cloud Functions v2 requires the Blaze (pay-as-you-go) plan, so this
  # never runs automatically — trigger it manually via "Run workflow" in the
  # Actions tab once the Firebase project is on Blaze and you're ready to ship
  # the backend.
  deploy-functions:
    name: Deploy Backend (optional, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      - name: Authenticate to Google Cloud
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 --decode > /tmp/gcp-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> $GITHUB_ENV

      - name: Deploy Cloud Function
        run: |
          npx firebase-tools deploy \
            --only functions \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive
