packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # Next.js bundles its own older postcss/sharp internally (separate from the
  # ones Tailwind/Vite use) — force the patched lines everywhere. postcss 8.x
  # and sharp 0.35.x are backward-compatible within the major.
  postcss: '^8.5.18'
  sharp: '^0.35.5'
  # Security overrides — first patched releases of the high/critical advisories
  # that `pnpm audit --audit-level=high` (the CI `security` job) flags in
  # transitive dependencies. Drop each entry once its direct dependency accepts
  # the patched version on its own; re-run `pnpm audit` after any dependency bump.
  js-yaml: '^4.3.2'           # GHSA-2883-xcg3-v3hh — eslint chain (lint-time only)
  nanoid: '^3.3.18'           # GHSA-2v37-7h3g-55p8 — postcss chain (build-time only)
  proxy-addr: '^2.0.8'        # GHSA-jqcg-44mw-7w3h — express chain (runtime)
  '@grpc/grpc-js': '^1.14.5'  # GHSA-m9gg-hp2v-232j — firebase-admin + firebase chains
  '@fastify/busboy': '^3.2.2' # GHSA-xjh9-v7x6-24jw, GHSA-x8mw-p69m-v3mx — firebase-admin chain
  source-map-js: '^1.2.2'     # GHSA-68fv-2mgg-jv7q — postcss/vite chains (build-time only)
  # brace-expansion is consumed in three incompatible majors — patch each line.
  'brace-expansion@1': '^1.1.21' # GHSA-6j4f-fj2g-mc7p
  'brace-expansion@2': '^2.1.7'  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  'brace-expansion@5': '^5.0.12' # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7

auditConfig:
  # GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3) has no patched release yet
  # (upstream: micromatch/braces#70). It is only reachable at lint time via
  # eslint-config-next → @next/eslint-plugin-next → fast-glob → micromatch,
  # never shipped or runtime-reachable. Remove this entry once braces ships
  # a fix.
  # Note: kept as `auditConfig.ignoreGhsas` (the pre-pnpm-11.16 spelling)
  # because CI pins pnpm 10, which does not read the newer `audit.ignore`.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
